    const p = this.game.player;
    const cards = choices.map((c, i) => `<div class="card" tabindex="0" data-i="${i}">
      <span class="keyHint">[${i + 1}]</span><div class="icon">${c.icon}</div><div class="name">${c.name}</div>
      <span class="tag ${c.isNew ? 'new' : ''}">${c.tag}</span><div class="desc">${c.desc}</div></div>`).join('');
    this.open(`<h2>⭐ ¡Nivel ${p.level}!</h2><p>Elige una mejora</p><div class="cards">${cards}</div>`);
    this.el.modal.querySelectorAll('.card').forEach(n => n.addEventListener('click', () => onPick(+n.dataset.i)));
  }
  showReward(def, level, onClaim) {
    const upgraded = level > 1;
    this.open(`<h2 style="color:var(--gold)">👑 ¡HABILIDAD ÚNICA DE JEFE!</h2>
      <p>Has derrotado a <b>${def.boss}</b>. Su poder ahora es tuyo para siempre.</p>
      <div class="cards"><div class="card ultCard"><div class="icon">${def.icon}</div><div class="name">${def.name}</div>
      <span class="tag new">${upgraded ? 'MEJORADA A NIVEL ' + level : 'DEFINITIVA PERMANENTE'}</span>
      <div class="desc">${def.desc}</div></div></div>
      <button class="btn goldBtn" id="claimBtn">Reclamar poder</button>`, 'gold');
    document.getElementById('claimBtn').onclick = onClaim;
  }
  showPause() {
    const g = this.game, p = g.player;
    const list = [...p.weapons.map(w => `${w.def.icon} ${w.def.name} Nv${w.level}`),
      ...[...p.passives].map(([id, lv]) => { const d = PASSIVE_DEFS.find(x => x.id === id); return `${d.icon} ${d.name} Nv${lv}`; }),
      ...[...g.ults.values()].map(u => `${u.def.icon} ${u.def.name} Nv${u.level}`)];
    this.open(`<h2>⏸ Pausa</h2>
      <p>Tiempo ${fmtTime(g.time)} · ${g.kills} eliminaciones · Nivel ${p.level}</p>
      <p style="font-size:13px">${list.join(' · ')}</p>
      <button class="btn" id="resumeBtn">Continuar</button>
      <button class="btn secondary" id="quitBtn">Abandonar</button>`);
    document.getElementById('resumeBtn').onclick = () => g.togglePause();
    document.getElementById('quitBtn').onclick = () => g.gameOver();
  }
  showGameOver(res) {
    const g = this.game, b = res.beaten, nr = '<div class="newRecord">¡NUEVO RÉCORD!</div>';
    this.open(`<h1>HAS CAÍDO</h1>
      <p>La horda te ha superado... esta vez.</p>
      <div class="records">
        <div class="record"><div class="v">${fmtTime(g.time)}</div><div class="l">Supervivencia</div>${b.time ? nr : ''}</div>
        <div class="record"><div class="v">${g.kills}</div><div class="l">Eliminaciones</div>${b.kills ? nr : ''}</div>
        <div class="record"><div class="v">${g.player.level}</div><div class="l">Nivel</div>${b.level ? nr : ''}</div>
      </div>
      <p>Jefes derrotados: <b>${g.bossesKilled}</b></p>
      <p style="font-size:12px">Récords — Tiempo: ${fmtTime(res.next.bestTime)} · Eliminaciones: ${res.next.bestKills} · Nivel: ${res.next.bestLevel}</p>
      <button class="btn" id="retryBtn">🔁 Reintentar</button>
      <button class="btn secondary" id="menuBtn">Menú</button>`);
    document.getElementById('retryBtn').onclick = () => g.start();
    document.getElementById('menuBtn').onclick = () => { g.state = 'menu'; this.showHud(false); this.showMenu(); };
  }
}

// ============================ JUEGO ============================
class Game {
  constructor() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    this.grid = new SpatialGrid(CFG.GRID_CELL);
    this.input = new Input(this, this.canvas);
    this.ui = new UI(this);
    this.state = 'menu';
    this.time = 0; this.shake = 0; this.last = 0;
    this.groundTile = this.makeGroundTile();
    this.webSprite = this.makeWebSprite();
    this.resize();
    window.addEventListener('resize', () => this.resize());
    document.addEventListener('visibilitychange', () => { if (document.hidden && this.state === 'playing') this.togglePause(); });
    this.reset();
    this.ui.showMenu();
    requestAnimationFrame(t => this.loop(t));
  }

  // ---------- Ciclo de vida ----------
  reset() {
    this.time = 0; this.kills = 0; this.bossesKilled = 0;
    this.player = new Player(this);
    this.enemies = []; this.projectiles = []; this.enemyBullets = []; this.pickups = [];
    this.particles = []; this.texts = []; this.effects = []; this.allies = []; this.puddles = [];
    this.pendingExplosions = [];
    this.ults = new Map();
    this.modalQueue = [];
    this.boss = null; this.bossIndex = 0; this.nextBossTime = CFG.BOSS_INTERVAL; this.bossWarned = false;
    this.spawnAcc = 0; this.nextWave = CFG.WAVE_INTERVAL;
    this.addWeapon('arcane');
    this.ui.invDirty = true;
    this.ui.setBoss(null);
  }
  start() {
    this.reset();
    this.state = 'playing';
    this.ui.close();
    this.ui.showHud(true);
    this.ui.banner('¡Sobrevive!', 'info', 2);
  }
  togglePause() {
    if (this.state === 'playing') { this.state = 'paused'; this.ui.showPause(); }
    else if (this.state === 'paused') { this.state = 'playing'; this.ui.close(); }
  }
  gameOver() {
    if (this.state === 'gameover') return;
    this.state = 'gameover';
    this.burst(this.player.x, this.player.y, '#ff4d6d', 60, 300);
    const res = Records.submit(Math.floor(this.time), this.kills, this.player.level);
    this.ui.showGameOver(res);
  }
  onKey(k) {
    if (k === 'p' || k === 'escape') { this.togglePause(); return; }
    if (this.state === 'modal' && this.currentChoices && ['1', '2', '3'].includes(k)) {
      const i = +k - 1;
      if (i < this.currentChoices.length) this.applyChoice(i);
      return;
    }
    if (this.state === 'modal' && this.currentReward && (k === 'enter' || k === ' ')) { this.currentReward(); return; }
    if (this.state !== 'playing') return;
    if (k === ' ') for (const id of ULT_ORDER) this.castUlt(id);
    const idx = ['1', '2', '3', '4'].indexOf(k);
    if (idx >= 0) this.castUlt(ULT_ORDER[idx]);
  }
  castUlt(id) {
    const u = this.ults.get(id);
    if (u && this.state === 'playing') u.tryCast();
  }

  // ---------- Vista / cámara ----------
  resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this.dpr = dpr;
    this.w = window.innerWidth; this.h = window.innerHeight;
    this.canvas.width = Math.floor(this.w * dpr); this.canvas.height = Math.floor(this.h * dpr);
    this.zoom = clamp(Math.min(this.w, this.h) / 720, 0.62, 1);
  }
  viewSize() { return { w: this.w / this.zoom, h: this.h / this.zoom }; }
  viewBounds(m = 0) {
    const v = this.viewSize(), p = this.player;
    return { x0: p.x - v.w / 2 - m, x1: p.x + v.w / 2 + m, y0: p.y - v.h / 2 - m, y1: p.y + v.h / 2 + m };
  }
  mouseWorld() {
    const p = this.player;
    return { x: p.x + (this.input.mouseX - this.w / 2) / this.zoom, y: p.y + (this.input.mouseY - this.h / 2) / this.zoom };
  }
  enemiesOnScreen() {
    const v = this.viewBounds();
    let n = 0;
    for (const e of this.enemies) if (!e.dead && e.x > v.x0 && e.x < v.x1 && e.y > v.y0 && e.y < v.y1) n++;
    return n;
  }
  /** Objetivo de las armas automáticas: el jefe si está a tiro, si no el más cercano. */
  preferredTarget(x, y, maxR) {
    const b = this.boss;
    if (b && !b.dead && dist2(x, y, b.x, b.y) < (maxR + b.r) ** 2) return b;
    return this.nearestEnemy(x, y, maxR);
  }
  nearestEnemy(x, y, maxR) {
    let best = null, bd = maxR * maxR;
    for (const e of this.grid.query(x, y, maxR)) {
      const d = dist2(x, y, e.x, e.y);
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }

  // ---------- Progresión ----------
  hpMult() { const m = this.time / 60; return 1 + m * 0.35 + m * m * 0.035; }
  addWeapon(id) {
    const def = WEAPON_DEFS.find(d => d.id === id);
    this.player.weapons.push(new def.cls(this, def));
  }
  /** Construye 3 opciones aleatorias de mejora (nuevas o subidas de nivel). */
  buildChoices() {
    const p = this.player, opts = [];
    for (const d of WEAPON_DEFS) {
      const w = p.weapons.find(x => x.id === d.id);
      if (w && w.level < d.max) opts.push({ kind: 'weapon', id: d.id, icon: d.icon, name: d.name, tag: 'Nivel ' + (w.level + 1), desc: diffText(w.stats(w.level), w.stats(w.level + 1)), weight: 3 });
      else if (!w && p.weapons.length < CFG.WEAPON_SLOTS) opts.push({ kind: 'weapon', id: d.id, icon: d.icon, name: d.name, tag: '¡NUEVA!', isNew: true, desc: d.intro, weight: 2.5 });
    }
    for (const d of PASSIVE_DEFS) {
      const lv = p.passives.get(d.id) || 0;
      if (lv > 0 && lv < d.max) opts.push({ kind: 'passive', id: d.id, icon: d.icon, name: d.name, tag: 'Nivel ' + (lv + 1), desc: d.desc, weight: 2 });
      else if (lv === 0 && p.passives.size < CFG.PASSIVE_SLOTS) opts.push({ kind: 'passive', id: d.id, icon: d.icon, name: d.name, tag: '¡NUEVA!', isNew: true, desc: d.desc, weight: 1.6 });
    }
    const out = [];
    while (out.length < 3 && opts.length) {
      let total = opts.reduce((s, o) => s + o.weight, 0), r = Math.random() * total, i = 0;
      while ((r -= opts[i].weight) > 0) i++;
      out.push(opts.splice(i, 1)[0]);
    }
    if (out.length < 3) out.push({ kind: 'heal', icon: '🍗', name: 'Festín', tag: 'Consumible', desc: 'Recupera el 50% de tu vida máxima.' });
    if (out.length < 3) out.push({ kind: 'fury', icon: '🩸', name: 'Furia', tag: 'Bonificación', desc: '+5% de daño permanente.' });
    return out;
  }
  applyChoice(i) {
    if (!this.currentChoices) return;
    const c = this.currentChoices[i], p = this.player;
    if (!c) return;
    if (c.kind === 'weapon') {
      const w = p.weapons.find(x => x.id === c.id);
      if (w) w.level++; else this.addWeapon(c.id);
    } else if (c.kind === 'passive') {
      p.passives.set(c.id, (p.passives.get(c.id) || 0) + 1);
    } else if (c.kind === 'heal') {
      p.heal(p.maxHp * 0.5);
    } else if (c.kind === 'fury') {
      p.bonusDamage += 0.05;
    }
    p.recalc();
    this.currentChoices = null;
    this.ui.invDirty = true;
    this.closeModal();
  }
  /** Otorga (o mejora) la habilidad única asociada al jefe derrotado. */
  grantUlt(id) {
    const def = ULT_DEFS[id];
    let u = this.ults.get(id);
    if (u) u.level = Math.min(3, u.level + 1);
    else { u = new def.cls(this, def); this.ults.set(id, u); }
    u.timer = 0;
    this.ui.invDirty = true;
    return u;
  }
  /** Abre la siguiente ventana pendiente (subida de nivel o recompensa de jefe). */
  openNextModal() {
    const m = this.modalQueue.shift();
    this.state = 'modal';
    if (m.type === 'levelup') {
      this.currentChoices = this.buildChoices();
      this.ui.showLevelUp(this.currentChoices, i => this.applyChoice(i));
    } else if (m.type === 'reward') {
      const def = ULT_DEFS[m.ult], cur = this.ults.get(m.ult);
      const nextLevel = cur ? Math.min(3, cur.level + 1) : 1;
      let claimed = false;
      this.currentReward = () => { if (claimed) return; claimed = true; this.currentReward = null; this.grantUlt(m.ult); this.player.heal(this.player.maxHp); this.closeModal(); };
      this.ui.showReward(def, nextLevel, this.currentReward);
    }
  }
  closeModal() {
    this.ui.close();
    this.state = 'playing';
  }

  // ---------- Generación de hordas y jefes ----------
  spawnRate() {
    const m = this.time / 60;
    return Math.min(18, 1.4 + m * 1.25 + Math.pow(m, 1.5) * 0.3) * (this.boss ? 0.55 : 1);
  }
  pickEnemyType() {
    const t = this.time, m = t / 60, w = [];
    for (const k in ENEMY_TYPES) {
      const d = ENEMY_TYPES[k];
      if (t < d.from) continue;
      const weight = k === 'skeleton' ? Math.max(1.5, 6 - m) : k === 'bat' ? 3 : k === 'zombie' ? 3 + m * 0.3 : k === 'spider' ? 2 + m * 0.3 : 1 + m * 0.25;
      w.push([k, weight]);
    }
    let total = w.reduce((s, x) => s + x[1], 0), r = Math.random() * total;
    for (const [k, v] of w) if ((r -= v) <= 0) return k;
    return 'skeleton';
  }
  spawnPos(extra = 0) {
    const v = this.viewSize(), R = Math.hypot(v.w, v.h) / 2 + 40 + extra, a = rand(0, TAU);
    return { x: this.player.x + Math.cos(a) * R, y: this.player.y + Math.sin(a) * R };
  }
  spawnEnemy(type, x, y) {
    const elite = this.time > 60 && Math.random() < 0.025;
    this.enemies.push(new Enemy(this, type, x, y, { elite }));
  }
  updateSpawner(dt) {
    // flujo constante
    this.spawnAcc += this.spawnRate() * dt;
    while (this.spawnAcc >= 1) {
      this.spawnAcc -= 1;
      if (this.enemies.length >= CFG.MAX_ENEMIES) { this.spawnAcc = 0; break; }
      const pos = this.spawnPos(rand(0, 80));
      this.spawnEnemy(this.pickEnemyType(), pos.x, pos.y);
    }
    // oleada de cerco cada minuto
    if (this.time >= this.nextWave) {
      this.nextWave += CFG.WAVE_INTERVAL;
      const n = Math.min(60, 16 + Math.floor(this.time / 60) * 6), type = this.pickEnemyType();
      const v = this.viewSize(), R = Math.hypot(v.w, v.h) / 2 + 30;
      for (let i = 0; i < n && this.enemies.length < CFG.MAX_ENEMIES + 60; i++) {
        const a = i / n * TAU;
        this.spawnEnemy(type, this.player.x + Math.cos(a) * R, this.player.y + Math.sin(a) * R);
      }
      if (!this.boss && this.time < this.nextBossTime - CFG.BOSS_WARNING) this.ui.banner('🌊 ¡Oleada ' + (Math.floor(this.time / 60) + 1) + '! Te están rodeando', 'info', 2.2);
    }
    // jefes
    const def = BOSS_DEFS[this.bossIndex % BOSS_DEFS.length];
    if (!this.bossWarned && this.time >= this.nextBossTime - CFG.BOSS_WARNING) {
      this.bossWarned = true;
      this.ui.banner('⚠ ¡ALERTA: ' + def.name + ' se aproxima! ⚠', 'alert', CFG.BOSS_WARNING - 1);
    }
    if (this.time >= this.nextBossTime) {
      if (this.boss) { this.nextBossTime += 10; this.bossWarned = false; return; }
      const pos = this.spawnPos(-40);
      this.boss = new def.cls(this, def, pos.x, pos.y);
      this.enemies.push(this.boss);
      this.bossIndex++;
      this.nextBossTime += CFG.BOSS_INTERVAL;
      this.bossWarned = false;
      this.shake = 18;
      this.ui.setBoss(this.boss);
      this.ui.banner('☠ ¡ALERTA: ' + def.name + ' ha aparecido! ☠', 'alert', 3);
    }
  }
  /** Recicla enemigos que quedan muy lejos: reaparecen delante del jugador. */
  recycleFar(e) {
    if (e.isBoss) return;
    const v = this.viewSize(), maxD = Math.hypot(v.w, v.h) / 2 + 380, p = this.player;
    const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy);
    if (d > maxD) {
      const R = Math.hypot(v.w, v.h) / 2 + 40;
      e.x = p.x - dx / d * R; e.y = p.y - dy / d * R;
    }
  }

  // ---------- Combate ----------
  /**
   * Punto único de daño a enemigos.
   * opts.raw: no aplica multiplicador de daño ni crítico (ya viene escalado).
   */
  damageEnemy(e, amount, opts = {}) {
    if (e.dead) return;
    const p = this.player;
    let crit = false;
    if (!opts.raw) {
      amount *= p.damageMult;
      if (Math.random() < p.crit) { amount *= p.critMult; crit = true; }
    }
    e.hp -= amount;
    e.flash = 0.08;
    if (opts.kx && !e.isBoss && !e.petrified) { e.kbx += opts.kx; e.kby += opts.ky; }
    if (this.texts.length < CFG.MAX_TEXTS && (!opts.small || Math.random() < 0.35)) {
      this.addText(e.x + rand(-6, 6), e.y - e.r, Math.round(amount), crit ? '#ffd23f' : opts.color || '#ffffff', crit ? 18 : 13);
    }
    // Maldición del Faraón: los petrificados explotan al recibir daño
    if (!e.isBoss && e.petrified && !e.exploding && this.ults.has('pharaoh')) {
      e.exploding = true;
      this.pendingExplosions.push({ e, t: 0.07 });
    }
    if (e.hp <= 0 && !e.exploding) this.killEnemy(e);
  }
  killEnemy(e) {
    if (e.dead) return;
    e.dead = true;
    this.kills++;
    this.burst(e.x, e.y, e.isBoss ? '#ffcc4d' : e.type === 'zombie' ? '#7fa36b' : e.type === 'spider' ? '#5a2a2a' : e.type === 'bat' ? '#6a4a8a' : '#ddd6c4', e.isBoss ? 80 : 7, e.isBoss ? 320 : 110);
    if (e.isBoss) return this.onBossKilled(e);
    this.dropGem(e.x, e.y, e.xp);
    const r = Math.random();
    if (e.elite) { if (r < 0.35) this.pickups.push(new Pickup(this, 'heal', e.x + 10, e.y)); }
    else if (r < 0.006) this.pickups.push(new Pickup(this, 'heal', e.x, e.y));
    else if (r < 0.0085) this.pickups.push(new Pickup(this, 'magnet', e.x, e.y));
  }
  onBossKilled(b) {
    this.bossesKilled++;
    this.boss = null;
    this.ui.setBoss(null);
    this.shake = 24;
    this.effects.push({ type: 'ring', x: b.x, y: b.y, r: 10, maxR: 400, life: 0.8, max: 0.8, color: '255,204,77' });
    this.pickups.push(new Pickup(this, 'relic', b.x, b.y, b.ultId));
    for (const eb of this.enemyBullets) { eb.dead = true; this.particle(eb.x, eb.y, 0, -30, '#ffffff', 0.4, 3); }
    for (let i = 0; i < 12; i++) this.dropGem(b.x + rand(-60, 60), b.y + rand(-60, 60), 10 + this.bossIndex * 4);
    this.ui.banner('🏆 ¡' + b.name + ' derrotado!', 'gold', 3);
  }
  dropGem(x, y, value) {
    const gems = this.pickups;
    if (gems.length >= CFG.MAX_GEMS) {
      // fusiona en una gema existente para no saturar
      const g = gems[randInt(0, gems.length - 1)];
      if (g.kind === 'gem') { g.value += value; return; }
    }
    gems.push(new Pickup(this, 'gem', x, y, value));
  }
  collect(pk) {
    const p = this.player;
    if (pk.kind === 'gem') p.addXp(pk.value);
    else if (pk.kind === 'heal') p.heal(30 + p.maxHp * 0.1);
    else if (pk.kind === 'magnet') { for (const x of this.pickups) if (x.kind === 'gem') x.attracted = true; this.addText(p.x, p.y - 30, '¡Imán!', '#ff6b6b', 18); }
    else if (pk.kind === 'relic') this.modalQueue.push({ type: 'reward', ult: pk.value });
  }
  /** Daño en área genérico (bolas de fuego). */
  explode(x, y, radius, dmg, color) {
    for (const e of this.grid.query(x, y, radius)) this.damageEnemy(e, dmg, { kx: (e.x - x) * 2, ky: (e.y - y) * 2 });
    this.effects.push({ type: 'boom', x, y, r: radius, life: 0.3, max: 0.3, color });
    this.burst(x, y, color, 10, 180);
  }
  /** Procesa las explosiones en cadena de la Maldición del Faraón. */
  updateExplosions(dt) {
    const curse = this.ults.get('pharaoh');
    const list = this.pendingExplosions;
    if (!list.length) return;
    this.pendingExplosions = [];
    for (const ex of list) {
      ex.t -= dt;
      if (ex.t > 0) { this.pendingExplosions.push(ex); continue; }
      const e = ex.e;
      if (e.dead) continue;
      const { radius, dmg } = curse.explosionFor(e);
      this.effects.push({ type: 'boom', x: e.x, y: e.y, r: radius, life: 0.35, max: 0.35, color: '#ffcc4d' });
      this.burst(e.x, e.y, '#ffcc4d', 8, 200);
      this.shake = Math.max(this.shake, 4);
      this.killEnemy(e);
      for (const o of this.grid.query(e.x, e.y, radius)) this.damageEnemy(o, dmg, { raw: true, color: '#ffcc4d' });
    }
  }

  // ---------- Efectos ----------
  particle(x, y, vx, vy, color, life, size) {
    if (this.particles.length >= CFG.MAX_PARTICLES) return;
    this.particles.push({ x, y, vx, vy, color, life, max: life, size, dead: false });
  }
  burst(x, y, color, n, speed) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), s = rand(0.3, 1) * speed;
      this.particle(x, y, Math.cos(a) * s, Math.sin(a) * s, color, rand(0.3, 0.7), rand(2, 4.5));
    }
  }
  addText(x, y, text, color, size = 13) {
    this.texts.push({ x, y, text, color, size, life: 0.7, dead: false });
  }

  // ---------- Bucle principal ----------
  loop(ts) {
    const dt = Math.min(0.05, (ts - (this.last || ts)) / 1000);
    this.last = ts;
    if (this.state === 'playing') this.update(dt);
    this.render();
    this.ui.update(dt);
    requestAnimationFrame(t => this.loop(t));
  }
  update(dt) {
    this.time += dt;
    const p = this.player;
    p.update(dt);
    // 1) enemigos: movimiento, separación y reciclaje
    this.rebuildGrid();
    for (const e of this.enemies) if (!e.dead) { e.update(dt); this.recycleFar(e); }
    if (this.state !== 'playing') return; // el jugador puede haber muerto
    this.separate();
    this.rebuildGrid();
    // 2) generación
    this.updateSpawner(dt);
    // 3) armas y habilidades
    for (const w of p.weapons) w.update(dt);
    for (const u of this.ults.values()) u.update(dt);
    for (const pr of this.projectiles) if (!pr.dead) pr.update(dt);
    for (const a of this.allies) if (!a.dead) a.update(dt);
    this.updateExplosions(dt);
    for (const b of this.enemyBullets) if (!b.dead) b.update(dt);
    for (const pk of this.pickups) if (!pk.dead) pk.update(dt);
    // 4) efectos visuales
    for (const pa of this.particles) { pa.x += pa.vx * dt; pa.y += pa.vy * dt; pa.vx *= 0.92; pa.vy *= 0.92; pa.life -= dt; if (pa.life <= 0) pa.dead = true; }
    for (const t of this.texts) { t.y -= 40 * dt; t.life -= dt; if (t.life <= 0) t.dead = true; }
    for (const ef of this.effects) { ef.life -= dt; if (ef.life <= 0) ef.dead = true; }
    if (this.shake > 0) this.shake = Math.max(0, this.shake - 40 * dt);
    // 5) limpieza
    compact(this.enemies); compact(this.projectiles); compact(this.enemyBullets); compact(this.pickups);
    compact(this.particles); compact(this.texts); compact(this.effects); compact(this.allies);
    if (this.boss && this.boss.dead) { this.boss = null; this.ui.setBoss(null); }
    // 6) ventanas pendientes (subida de nivel / recompensas)
    if (this.state === 'playing' && this.modalQueue.length) this.openNextModal();
  }
  rebuildGrid() {
    this.grid.clear();
    for (const e of this.enemies) if (!e.dead) this.grid.insert(e);
  }
  /** Separación suave entre enemigos para que la horda no se apile. */
  separate() {
    for (const e of this.enemies) {
      if (e.dead || e.petrified) continue;
      for (const o of this.grid.query(e.x, e.y, e.r)) {
        if (o === e) continue;
        const dx = e.x - o.x, dy = e.y - o.y, min = e.r + o.r;
        const d2v = dx * dx + dy * dy;
        if (d2v >= min * min || d2v === 0) continue;
        const d = Math.sqrt(d2v), push = (min - d) * (o.isBoss ? 0.9 : e.isBoss ? 0.05 : 0.4);
        e.x += dx / d * push; e.y += dy / d * push;
      }
    }
  }

  // ---------- Renderizado ----------
  makeGroundTile() {
    const S = 256, cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const c = cv.getContext('2d');
    c.fillStyle = '#1b2417'; c.fillRect(0, 0, S, S);
    for (let i = 0; i < 900; i++) {
      const x = hash2(i, 1) * S, y = hash2(i, 2) * S, v = hash2(i, 3);
      c.fillStyle = v < 0.5 ? 'rgba(0,0,0,0.18)' : v < 0.85 ? 'rgba(80,110,60,0.18)' : 'rgba(120,100,70,0.2)';
      c.fillRect(x, y, 2 + v * 3, 2 + v * 3);
    }
    for (let i = 0; i < 40; i++) {
      const x = hash2(i, 7) * S, y = hash2(i, 8) * S;
      c.strokeStyle = 'rgba(90,130,60,0.35)'; c.lineWidth = 1;
      line(c, x, y, x - 2, y - 6); line(c, x + 2, y, x + 3, y - 5);
    }
    return cv;
  }
  makeWebSprite() {
    const S = 128, cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const c = cv.getContext('2d'), m = S / 2;
    const grd = c.createRadialGradient(m, m, 4, m, m, m);
    grd.addColorStop(0, 'rgba(120,255,80,0.35)'); grd.addColorStop(1, 'rgba(60,160,40,0.08)');
    c.fillStyle = grd; circle(c, m, m, m - 1); c.fill();
    c.strokeStyle = 'rgba(220,255,200,0.45)'; c.lineWidth = 1.2;
    for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; line(c, m, m, m + Math.cos(a) * (m - 2), m + Math.sin(a) * (m - 2)); }
    for (let k = 1; k <= 4; k++) {
      c.beginPath();
      for (let i = 0; i <= 8; i++) { const a = i / 8 * TAU, rr = (m - 2) * k / 4; i ? c.lineTo(m + Math.cos(a) * rr, m + Math.sin(a) * rr) : c.moveTo(m + Math.cos(a) * rr, m + Math.sin(a) * rr); }
      c.stroke();
    }
    return cv;
  }
  /** Decoración determinista del escenario (lápidas, huesos, rocas). */
  drawProps(c, v) {
    const S = 260;
    for (let cx = Math.floor(v.x0 / S); cx <= Math.floor(v.x1 / S); cx++) {
      for (let cy = Math.floor(v.y0 / S); cy <= Math.floor(v.y1 / S); cy++) {
        const h = hash2(cx, cy, 11);
        if (h > 0.45) continue;
        const x = cx * S + hash2(cx, cy, 12) * S, y = cy * S + hash2(cx, cy, 13) * S, t = hash2(cx, cy, 14);
        if (t < 0.35) { // lápida
          c.fillStyle = '#4a4a55'; c.beginPath(); c.roundRect(x - 10, y - 22, 20, 24, [10, 10, 2, 2]); c.fill();
          c.fillStyle = '#3a3a44'; c.fillRect(x - 6, y - 14, 12, 2); c.fillRect(x - 1, y - 18, 2, 10);
        } else if (t < 0.6) { // huesos
          c.strokeStyle = '#a8a294'; c.lineWidth = 3; c.lineCap = 'round';
          line(c, x - 8, y - 3, x + 8, y + 3); line(c, x - 6, y + 5, x + 7, y - 4);
        } else if (t < 0.85) { // roca
          c.fillStyle = '#353b33'; ellipse(c, x, y, 14, 9); c.fill();
          c.fillStyle = '#454c42'; ellipse(c, x - 3, y - 3, 7, 4); c.fill();
        } else { // arbusto seco
          c.strokeStyle = '#4b3a28'; c.lineWidth = 2;
          for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i - 2) * 0.35; line(c, x, y, x + Math.cos(a) * 16, y + Math.sin(a) * 16); }
        }
      }
    }
  }
  render() {
    const c = this.ctx, p = this.player;
    const z = this.zoom * this.dpr, v = this.viewSize();
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = '#0b0a10'; c.fillRect(0, 0, this.canvas.width, this.canvas.height);
    const sx = this.shake ? rand(-this.shake, this.shake) * 0.5 : 0, sy = this.shake ? rand(-this.shake, this.shake) * 0.5 : 0;
    const camX = p.x - v.w / 2 + sx, camY = p.y - v.h / 2 + sy;
    c.setTransform(z, 0, 0, z, -camX * z, -camY * z);
    const vb = { x0: camX - 60, x1: camX + v.w + 60, y0: camY - 60, y1: camY + v.h + 60 };
    const inView = (o, m = 0) => o.x > vb.x0 - m && o.x < vb.x1 + m && o.y > vb.y0 - m && o.y < vb.y1 + m;

    // suelo con patrón anclado al mundo
    if (!this.groundPattern) this.groundPattern = c.createPattern(this.groundTile, 'repeat');
    c.fillStyle = this.groundPattern; c.fillRect(vb.x0, vb.y0, vb.x1 - vb.x0, vb.y1 - vb.y0);
    this.drawProps(c, vb);

    // charcos de veneno permanentes
    for (const pd of this.puddles) {
      if (!inView(pd, pd.r)) continue;
      const s = pd.r * 2 * Math.min(1, (this.time - pd.born) * 4 + 0.2);
      c.save(); c.translate(pd.x, pd.y); c.rotate(pd.rot);
      c.drawImage(this.webSprite, -s / 2, -s / 2, s, s); c.restore();
    }
    for (const w of p.weapons) if (w instanceof HolyAura) w.draw(c);
    for (const pk of this.pickups) if (inView(pk)) pk.draw(c);
    // enemigos (los jefes al final para que queden encima)
    for (const e of this.enemies) if (!e.isBoss && inView(e, e.r)) e.draw(c);
    if (this.boss) this.boss.draw(c);
    if (this.state !== 'gameover') p.draw(c);
    for (const w of p.weapons) if (!(w instanceof HolyAura)) w.draw(c);
    for (const a of this.allies) a.draw(c);
    for (const pr of this.projectiles) if (inView(pr)) pr.draw(c);
    for (const b of this.enemyBullets) if (inView(b)) b.draw(c);
    for (const u of this.ults.values()) u.draw(c);
    // efectos
    for (const ef of this.effects) {
      const k = ef.life / ef.max;
      if (ef.type === 'bolt') {
        c.strokeStyle = `rgba(190,245,255,${k})`; c.lineWidth = 3; c.beginPath();
        for (let i = 0; i < ef.pts.length; i++) {
          const pt = ef.pts[i];
          if (!i) { c.moveTo(pt.x, pt.y); continue; }
          const pr = ef.pts[i - 1];
          for (let s = 1; s <= 3; s++) { const f = s / 4; c.lineTo(pr.x + (pt.x - pr.x) * f + rand(-8, 8), pr.y + (pt.y - pr.y) * f + rand(-8, 8)); }
          c.lineTo(pt.x, pt.y);
        }
        c.stroke();
        c.strokeStyle = `rgba(255,255,255,${k})`; c.lineWidth = 1; c.stroke();
      } else if (ef.type === 'boom') {
        c.fillStyle = ef.color; c.globalAlpha = k * 0.5; circle(c, ef.x, ef.y, ef.r * (1.1 - k * 0.4)); c.fill(); c.globalAlpha = 1;
      } else if (ef.type === 'ring') {
        c.strokeStyle = `rgba(${ef.color},${k})`; c.lineWidth = 8; circle(c, ef.x, ef.y, ef.r + (ef.maxR - ef.r) * (1 - k)); c.stroke();
      }
    }
    for (const pa of this.particles) {
      c.globalAlpha = pa.life / pa.max; c.fillStyle = pa.color;
      c.fillRect(pa.x - pa.size / 2, pa.y - pa.size / 2, pa.size, pa.size);
    }
    c.globalAlpha = 1;
    c.textAlign = 'center'; c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,0.75)';
    for (const t of this.texts) {
      c.globalAlpha = Math.min(1, t.life * 2.5);
      c.font = `800 ${t.size}px system-ui, sans-serif`;
      c.strokeText(t.text, t.x, t.y); c.fillStyle = t.color; c.fillText(t.text, t.x, t.y);
    }
    c.globalAlpha = 1;
    // flecha hacia el jefe si está fuera de pantalla
    if (this.boss && !inView(this.boss, -60)) {
      const b = this.boss, a = Math.atan2(b.y - p.y, b.x - p.x);
      const R = Math.min(v.w, v.h) / 2 - 40;
      const ax = p.x + Math.cos(a) * R, ay = p.y + Math.sin(a) * R;
      c.save(); c.translate(ax, ay); c.rotate(a);
      c.fillStyle = `rgba(255,77,77,${0.6 + Math.sin(this.time * 8) * 0.3})`;
      c.beginPath(); c.moveTo(18, 0); c.lineTo(-10, -12); c.lineTo(-4, 0); c.lineTo(-10, 12); c.closePath(); c.fill();
      c.restore();
    }
  }
}

// ============================ ARRANQUE ============================
window.game = new Game();
</script>
