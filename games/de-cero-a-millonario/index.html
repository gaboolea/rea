<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>De Cero a Millonario</title>
    <meta
      name="description"
      content="Simulador 3D de negocios: empieza con una pequeña tienda y conviértete en millonario."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="loading">
      <div class="loader"></div>
      <span>Cargando la ciudad…</span>
    </div>

    <!-- Pantalla de inicio (la ciudad 3D sigue viva detrás) -->
    <div id="title" hidden>
      <h1 class="logo" aria-label="De Cero a Millonario">
        <span class="logo-small">DE CERO A</span>
        <span class="logo-big" id="logo-big">MILLONARIO</span>
      </h1>
      <p class="tagline">Construye tu imperio, caja a caja</p>
      <nav class="title-menu">
        <button id="t-continue" class="tbtn green" hidden>
          CONTINUAR<small id="t-continue-info"></small>
        </button>
        <button id="t-play" class="tbtn purple">JUGAR</button>
        <button id="t-multi" class="tbtn orange">MULTIJUGADOR</button>
        <button id="t-custom" class="tbtn teal">PERSONALIZAR PERSONAJE</button>
        <div class="tbtn-row">
          <button id="t-options" class="tbtn blue small">OPCIONES</button>
          <button id="t-credits" class="tbtn pink small">CRÉDITOS</button>
        </div>
      </nav>
      <button id="t-sound" class="sound-chip">
        🔈 Toca para activar la música
      </button>
      <div class="title-version">v2.0</div>
    </div>

    <!-- Personalización -->
    <div id="wardrobe" hidden>
      <div id="wardrobe-view"></div>
      <section id="wd-panel">
        <header>
          <h2>Tu personaje</h2>
          <span id="wd-money" class="pill-money"></span>
        </header>
        <div id="wd-slots"></div>
        <div class="wd-picker">
          <button id="wd-prev" class="wd-arrow">◀<span>ANTERIOR</span></button>
          <div class="wd-current">
            <b id="wd-item"></b>
            <small id="wd-count"></small>
            <span id="wd-status" class="tag"></span>
          </div>
          <button id="wd-next" class="wd-arrow"><span>SIGUIENTE</span>▶</button>
        </div>
        <div id="wd-colors"></div>
        <button id="wd-equip" class="wd-equip">EQUIPAR</button>
        <div class="wd-actions">
          <button id="wd-back" class="wd-ghost">Volver</button>
          <button id="wd-start" class="wd-start">COMENZAR PARTIDA</button>
        </div>
        <small class="wd-hint">Arrastra el personaje para girarlo</small>
      </section>
    </div>

    <!-- HUD durante la partida -->
    <div id="hud" hidden>
      <div class="hud-left">
        <div id="hud-money" class="pill">
          <span class="coin">$</span>
          <div>
            <b id="money">$150</b>
            <small
              ><span id="today">+$0 hoy</span> · <span id="stage"></span
            ></small>
          </div>
        </div>
        <button id="objective" class="objective">
          <span class="obj-icon">🎯</span>
          <span class="obj-body">
            <span id="objective-text"></span>
            <small id="objective-hint"></small>
            <span id="objective-bar" class="bar-track" hidden><i></i></span>
          </span>
          <span class="obj-side">
            <em id="objective-reward"></em>
            <small id="objective-count"></small>
          </span>
        </button>
        <div id="event-chip" class="chip" hidden>
          <span class="chip-icon"></span><span class="chip-text"></span><i></i>
        </div>
        <div id="encargo-chip" class="chip encargo" hidden>
          <span class="chip-icon">📦</span><span class="chip-text"></span
          ><i></i>
        </div>
      </div>
      <div class="hud-right">
        <div class="pill clock-pill">
          <span id="clock-icon">☀️</span><b id="clock">07:00</b
          ><small id="day">Día 1</small>
        </div>
        <div class="hud-buttons">
          <button id="btn-sound" title="Sonido">🔊</button>
          <button id="btn-bag" title="Inventario (I)">🎒</button>
          <button id="btn-map" title="Mapa (M)">🗺️</button>
          <button id="btn-manage" title="Gestión (G)">📊</button>
          <button id="btn-menu" title="Pausa (Esc)">⏸</button>
        </div>
        <div id="net-pill" class="pill net-pill" hidden>
          <i></i><span id="net-text"></span>
        </div>
        <canvas
          id="minimap"
          width="150"
          height="150"
          title="Abrir mapa"
        ></canvas>
        <button id="btn-home" class="home-btn" hidden>🏪 IR A MI TIENDA</button>
      </div>
    </div>

    <div id="nav-arrow" hidden>
      <div class="nav-pointer">▲</div>
      <div class="nav-label"></div>
    </div>
    <div id="tutorial-card" hidden>
      <header>
        <span>📦 Tutorial del Mayorista <b class="tut-count"></b></span>
        <button id="tut-skip">Saltar</button>
      </header>
      <ol></ol>
    </div>
    <div id="social" hidden>
      <button id="btn-wave" title="Saludar (1)">👋</button>
      <button id="btn-cheer" title="Celebrar (2)">🎉</button>
      <button id="btn-dance" title="Bailar (3)">💃</button>
      <button id="btn-chat" title="Chat (Enter)">💬</button>
      <button id="btn-rank" title="Clasificación (L)">🏆</button>
    </div>
    <div id="chat" hidden>
      <div id="chat-log"></div>
      <form id="chat-form">
        <input
          id="chat-input"
          maxlength="120"
          autocomplete="off"
          placeholder="Escribe un mensaje… (Enter)"
        />
        <button type="submit">Enviar</button>
      </form>
    </div>
    <div id="money-floats"></div>
    <div id="carry" hidden></div>
    <div id="prompt" hidden></div>
    <div id="toasts"></div>
    <div id="mission-done"></div>
    <div id="day-report"></div>

    <div id="touch-controls">
      <div id="joy-zone">
        <div id="joystick"><div id="joystick-knob"></div></div>
      </div>
      <div id="touch-buttons">
        <button id="btn-ride" hidden>🛴</button>
        <button id="btn-jump">⤒</button>
        <button id="btn-run">🏃</button>
        <button id="btn-interact">✋</button>
      </div>
    </div>

    <div id="panel" hidden>
      <div id="panel-card">
        <header>
          <h2 id="panel-title"></h2>
          <button id="panel-close" aria-label="Cerrar">✕</button>
        </header>
        <div id="panel-body"></div>
      </div>
    </div>

    <div id="fade"></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
